# ============================================================================
#  File        : .github/workflows/ci.yml
#  Description : Continuous integration for the SystemVerilog Ethernet L2 switch,
#                running on a SELF-HOSTED runner.
#
#                Three jobs, in dependency order:
#
#                  1. lint     - syntax, elaboration and synthesis: a Verilator
#                                 -Wall lint, an Icarus elaboration of the RTL on
#                                 its own, and a yosys read + elaborate +
#                                 synthesise, which is the only gate that
#                                 enforces the synthesis restrictions the
#                                 simulators cannot see.  The toolchain is
#                                 asserted against a written contract first.
#                  2. test     - the full regression: three block level
#                                 testbenches, the four-port mixed-speed switch
#                                 testbench, and the three-port parameterisation
#                                 testbench.  Logs are uploaded as an artifact.
#                  3. gds      - the LibreLane flow, producing a GDSII.  GATED
#                                 BEHIND A MANUAL APPROVAL.
#
#  ---------------------------------------------------------------------------
#  The runner, and who provides what
#  ---------------------------------------------------------------------------
#  Every job runs on `[self-hosted, linux, x64]` - the label set the runner
#  application registers with by default, so nothing has to be added to the
#  machine for the labels to match.  The split of responsibilities is the part
#  worth reading before changing anything:
#
#    * The HOST provides Docker, and nothing else.  Docker is needed twice over:
#      it runs the two container jobs, and it runs the LibreLane image in the
#      `gds` job.  This workflow installs nothing on the host, on purpose - the
#      host is a machine that is kept, not an image that is thrown away, and an
#      `apt-get install` in a job that runs on every push is a way to end up
#      with a toolchain nobody can reconstruct.
#
#    * The EDA TOOLCHAIN comes from a container image, declared per job with
#      `container:`.  That image is the pin the runner label used to be:
#      iverilog, verilator and yosys are whatever it ships.  `EXPECTED_OS` below
#      and `ci/check-toolchain.sh` are what hold it still - a tool that crosses
#      a major version inside a rebuilt image fails the job by name, instead of
#      quietly changing what `make lint` reports.  See AGENTS.md section 2.2 for
#      why a *silent* bump in the dangerous direction is the one to fear.
#
#  Two requirements on that image, both of which fail in ways that do not name
#  the cause:
#
#    - It must be glibc-based (Debian or Ubuntu), NOT Alpine.  A container job
#      runs its JavaScript action steps inside the image, using a Node binary
#      bind-mounted in from the runner, and that binary does not start against
#      musl.  On Alpine the failure is a dynamic-loader error in the *first*
#      step, which reads like a broken runner.
#    - It needs `git`, `bash`, `make` and the three EDA tools on PATH.
#      `ci/check-toolchain.sh` names a missing EDA tool, which is the intended
#      failure, but it cannot name a missing `make`.
#
#  The image is written at each `container:` site rather than in `env` because
#  the `env` context is not available in `jobs.<job_id>.container.image`:
#  GitHub allows only `github`, `needs`, `strategy`, `matrix`, `vars` and
#  `inputs` there, and an unset expression there is a hard error rather than an
#  empty string.  So the two sites have to be kept in step by hand.  The
#  alternative, if that becomes annoying, is a repository variable and
#  `vars.TOOLCHAIN_IMAGE` in both.
#
#  ---------------------------------------------------------------------------
#  What a self-hosted runner changes, beyond the label
#  ---------------------------------------------------------------------------
#  A GitHub-hosted runner is created empty and destroyed afterwards, so most of
#  what follows never shows up there.
#
#  1. ROOT-OWNED FILES IN THE WORKSPACE.  A container job runs as the image's
#     default user, which for a build image is root, and the workspace is a bind
#     mount of the runner's own directory.  Everything the job writes is
#     therefore root-owned, and the *next* run's `actions/checkout` does
#     `git clean -ffdx && git reset --hard` as the unprivileged runner user,
#     which cannot unlink them.  The symptom is the second run of a job failing
#     in its first step with EACCES and no mention of permissions.  The
#     `if: always()` chown step at the end of each container job hands the tree
#     back.  If a run is cancelled hard enough that even that step is skipped,
#     recover on the host with
#         sudo chown -R "$(id -u):$(id -g)" <runner-dir>/_work
#  2. NO PARALLELISM.  A runner executes one job at a time, so the three jobs
#     serialise even though `needs:` would allow overlap.  The timeouts are per
#     job, not for the workflow as a whole.
#  3. THE PDK LIVES ON THE HOST, not in the workspace.  `git clean -ffdx`
#     deletes ignored files, so a PDK under `.cache/librelane` inside the
#     checkout is destroyed by the next job and has to be re-downloaded -
#     over a gigabyte, and minutes of wall clock - every time a cache entry is
#     evicted.  The machine does not go away between runs, so the directory is
#     its own cache and `actions/cache` is not used for it.  See the `gds` job.
#  4. `pull_request` RUNS UNTRUSTED CODE ON YOUR MACHINE.  This is the one that
#     is not a papercut.  A pull request from a fork is checked out and
#     executed on the self-hosted runner with that runner's token, its network
#     and its filesystem - and the `gds` job hands a container the right to
#     write into the workspace.  If this repository takes pull requests from
#     people you do not control, that is a remote code execution path into
#     whatever machine the runner is on.  GitHub's own guidance is not to run
#     untrusted workflows on self-hosted runners.  The ways out, in the order
#     they are worth considering:
#       - do not accept pull requests from outside the repository (push to a
#         branch instead, and gate on branch protection);
#       - run the untrusted half on GitHub-hosted runners and keep the physical
#         flow on the self-hosted one, which is the split this file would have
#         if only the `gds` job were self-hosted;
#       - put the runner on a disposable machine or VM with nothing else on it.
#     Nothing in this workflow can enforce any of that - it is a property of who
#     may push here, not of the YAML.
#
#  ---------------------------------------------------------------------------
#  The toolchain contract
#  ---------------------------------------------------------------------------
#  `EXPECTED_OS` is the `/etc/os-release` `VERSION_ID` the toolchain image is
#  expected to report, and it is asserted rather than reported: the lint and
#  test jobs run `ci/check-toolchain.sh` with `ASSERT_OS=1`, so a toolchain image
#  that was rebuilt on a different base distribution fails the job instead of
#  quietly changing which Verilator is grading the RTL.  A local run leaves the
#  assertion off, because a local WSL distribution is not a CI toolchain and
#  should not have to be.  The three tool versions are the single place that
#  contract is written down; nothing here repeats them.
#
#  When the toolchain moves, `ci/check-toolchain.sh` and `EXPECTED_OS` here have
#  to be updated in the same commit, and the regression re-run - not just the
#  job that failed.
#
#  ---------------------------------------------------------------------------
#  Dependency policy - read this before changing a version below
#  ---------------------------------------------------------------------------
#  * The GitHub actions are pinned to their major tag (`@v7`, `@v6`).  A major
#    tag moves with the project, so patch and minor security updates arrive
#    without a commit, and a major change requires a review of this file.
#  * The EDA tools come from the toolchain container image, and that image is
#    pinned by tag.  The reasoning is the one the runner-image pin used to
#    carry: distribution builds carry security updates, and a third-party APT
#    repository in the supply path of the job that gates every commit is not
#    worth a newer Verilator.  The difference is that the pin is now one tag the
#    repository controls rather than a property of somebody else's image, so
#    `ci/check-toolchain.sh` is what stops the tag from being repointed at a
#    base distribution with a different tool generation.
#  * The LibreLane image is pinned to an exact tag.  It is a Nix closure, the
#    design is elaborated against the yosys inside it, and a floating tag would
#    make a GDSII irreproducible.
#
#  ---------------------------------------------------------------------------
#  The approval gate
#  ---------------------------------------------------------------------------
#  Job 3 declares `environment: production`.  A GitHub *Environment* named
#  `production` has to exist in this repository with "Required reviewers" enabled,
#  otherwise the job starts immediately and there is no gate at all.
#
#  To set it up (repository settings, not something a workflow can create):
#      Settings -> Environments -> New environment -> name it `production`
#      -> "Required reviewers" -> add yourself (and whoever else may sign off a
#         tape-out), optionally restrict it to selected branches, save.
#
#  Until that environment exists the flow still runs, but it runs unattended.
#  If the gate matters, verify the environment is configured before trusting a
#  green check - the workflow cannot enforce it on its own.
#
#  Why the gate exists: the GDS job is by far the most expensive (a multi-GB
#  container image, a ~100 MB PDK download, and tens of minutes of compute) and
#  it is the only job that produces an artefact anyone might act on.  A sign-off
#  step before a physical deliverable is produced is worth more than the
#  convenience of having it run on every push.
#
#  One consequence of a single self-hosted runner is worth knowing: a job waiting
#  for an environment approval is *not* dispatched to a runner, so a GDS job
#  sitting in the approval queue blocks nothing.  A GDS job that has been
#  approved and started does - it holds the runner alone for up to its
#  180-minute budget, and the next push's `lint` job waits behind it.  If that
#  latency is a problem the fix is a second runner, not a shorter timeout.
# ============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel a superseded run on the same ref.  The GDS job is exempt from the
# automatic cancellation below because it is the one that waits for a human.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # ---- the toolchain contract --------------------------------------------
  # See "The toolchain contract" in the header.  This is the *image's* base
  # distribution, not the host's: the jobs that assert it run inside the
  # toolchain container, so this is also a check that the container is the one
  # that was intended and not a stale local build.
  EXPECTED_OS: "24.04"

  # ---- the physical flow -------------------------------------------------
  # An exact tag, not a floating `latest`: this is a Nix closure, the RTL is
  # elaborated against the yosys inside it, and a GDSII has to be reproducible
  # from the tag it claims to come from.
  LIBRELANE_IMAGE: ghcr.io/librelane/librelane:3.0.14
  LIBRELANE_PDK: sky130A
  LIBRELANE_SCL: sky130_fd_sc_hd

jobs:
  # ==========================================================================
  # 1. Syntax / elaboration / synthesis
  # ==========================================================================
  lint:
    name: lint and elaborate
    # The default self-hosted label set, which every runner registers with and
    # which therefore needs no extra configuration on the machine.  Adding a
    # custom label (say `eda`) to this list is how you keep a job off a machine
    # that has Docker but not the disk for it; the runner then needs that label
    # at registration time.
    runs-on: [self-hosted, linux, x64]

    # The EDA toolchain: glibc-based, with git / bash / make / iverilog /
    # verilator / yosys on PATH.  ** REPLACE the tag, and keep it in step with
    # the `test` job below - there is no env var to keep in step, see the
    # header. **
    container:
      image: ghcr.io/cw1997/sw-toolchain:replace-me

    timeout-minutes: 10

    steps:
      - name: Check out the sources
        uses: actions/checkout@v7

      # Runs before any gate, so that a toolchain that moved is reported as a
      # toolchain problem rather than as a mysterious Verilator warning.
      # Invoked through `bash` so that the step does not depend on the file
      # carrying an executable bit, which a Windows checkout will not set.
      - name: Check the toolchain against the CI contract
        run: bash ci/check-toolchain.sh
        env:
          # Assert the base distribution here and not in a local run: see the
          # header.  This is what stops a rebuilt toolchain image from silently
          # changing the linter.
          ASSERT_OS: "1"

      - name: Cache the build directory
        uses: actions/cache@v6
        with:
          path: build
          key: lint-${{ runner.os }}-${{ hashFiles('rtl/*.sv') }}
          restore-keys: lint-${{ runner.os }}-

      # Verilator with -Wall and the default error policy: any warning fails.
      # This is the job that catches width mismatches, unused signals, latch
      # inference and incomplete sensitivity lists, none of which a simulation
      # would necessarily notice.
      - name: Lint the RTL
        run: make lint

      # Icarus elaboration of the RTL alone, with no testbench.  A design that
      # only elaborates because a testbench declares a missing signal fails here.
      - name: Elaborate the RTL standalone
        run: make rtl

      # yosys read + elaborate + synthesise.  This is the only gate that enforces
      # the three synthesis restrictions the simulators cannot see - no package
      # or import, no `return` in a function, a package-width port declaration -
      # so a change that violates one passes every other job and then fails in
      # the physical flow, tens of minutes into the most expensive job there is.
      - name: Synthesise the RTL with yosys
        run: make synth

      # LAST, and `always()`, because this is a cleanup step and a cleanup step
      # that does not run is the bug.  See "What a self-hosted runner changes"
      # item 1 in the header for the failure this prevents.
      - name: Hand the workspace back to the runner user
        if: always()
        run: |
          # `/__w` is created by the runner, not by the container, so its
          # ownership is the runner user's - which is the ownership the next
          # job's checkout needs to be able to `git clean`.  Silently skipped
          # when the image already runs as that user, or when the container is
          # not on the Linux bind-mount layout and `stat` finds nothing.
          host_uid=$(stat -c '%u' /__w 2>/dev/null) || host_uid=
          host_gid=$(stat -c '%g' /__w 2>/dev/null) || host_gid=
          if [ -n "$host_uid" ] && [ "$host_uid" != "$(id -u)" ]; then
            chown -R "$host_uid:$host_gid" "$GITHUB_WORKSPACE" || true
          fi

  # ==========================================================================
  # 2. Regression
  # ==========================================================================
  test:
    name: regression
    needs: lint
    runs-on: [self-hosted, linux, x64]

    # ** Keep in step with the `lint` job. **  A job-level `container:` applies
    # to the whole job, which is why the image has to be a complete toolchain
    # rather than one with iverilog in it: the same image has to satisfy the
    # contract the lint job asserts, and a test job that silently ran a
    # different simulator than the one the gates were written against is exactly
    # the failure the toolchain contract exists to catch.
    container:
      image: ghcr.io/cw1997/sw-toolchain:replace-me

    # The main testbench drives a 10 Mbit/s port on a 125 MHz core, so a single
    # frame needs ~10 000 clocks and the suite has to wait for the slowest port
    # between every test.  This is the reason the job needs a generous bound.
    timeout-minutes: 45

    steps:
      - name: Check out the sources
        uses: actions/checkout@v7

      # The same gate as the lint job, and asserted the same way.  It is cheap
      # (a few hundred milliseconds) and it is the difference between a
      # regression that fails because the design changed and one that fails
      # because the simulator did.  It also prints the version table, which
      # replaces the `iverilog -V | head -1` this step used to run.
      - name: Check the toolchain against the CI contract
        run: bash ci/check-toolchain.sh
        env:
          ASSERT_OS: "1"

      - name: Cache the build directory
        uses: actions/cache@v6
        with:
          path: build
          key: test-${{ runner.os }}-${{ hashFiles('rtl/*.sv', 'tb/*.sv') }}
          restore-keys: test-${{ runner.os }}-

      # Block level testbenches first: they are milliseconds each and isolate a
      # failure to a single block, which is the difference between "the CAM is
      # wrong" and "something somewhere is wrong".
      - name: Block level testbenches
        run: make unit

      - name: Four-port mixed-speed switch testbench
        run: |
          set -o pipefail
          make sim 2>&1 | tee build/sim.log

      - name: Three-port parameterisation testbench
        run: |
          set -o pipefail
          make param 2>&1 | tee build/param.log

      # Always upload the logs, including on failure: a regression that fails at
      # 03:00 is only diagnosable with the log that says how.
      - name: Upload the simulation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulation-logs
          path: build/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Hand the workspace back to the runner user
        if: always()
        run: |
          host_uid=$(stat -c '%u' /__w 2>/dev/null) || host_uid=
          host_gid=$(stat -c '%g' /__w 2>/dev/null) || host_gid=
          if [ -n "$host_uid" ] && [ "$host_uid" != "$(id -u)" ]; then
            chown -R "$host_uid:$host_gid" "$GITHUB_WORKSPACE" || true
          fi

  # ==========================================================================
  # 3. Physical implementation - GATED BEHIND A MANUAL APPROVAL
  # ==========================================================================
  gds:
    name: GDSII (approval required)
    needs: [lint, test]

    # ==========================================================================
    #  THE APPROVAL GATE
    #
    #  This line is the whole mechanism.  A job that names an environment waits
    #  for that environment's protection rules before it is scheduled, and an
    #  environment with "Required reviewers" configured holds the job until a
    #  reviewer approves it in the UI (or via the REST API).
    #
    #  Configure the environment in the repository settings - see the header of
    #  this file.  If `production` does not exist, GitHub creates nothing and no
    #  approval is requested.
    # ==========================================================================
    environment: production

    runs-on: [self-hosted, linux, x64]

    # NOTE: no `container:` here, and that is not an oversight.  This job starts
    # a container of its own (the LibreLane image) and a container cannot nest
    # inside another one without a Docker socket mount, which would be a
    # privilege escalation on the host for no benefit.  So this job runs on the
    # host, and the host needs the tools it actually uses - docker, git, find,
    # tee - and none of the EDA ones.

    # LibreLane pulls a multi-gigabyte image, downloads the PDK and then runs
    # tens of minutes of place-and-route.  A short timeout here turns a slow
    # machine into a red run that looks like a design failure.
    timeout-minutes: 180

    steps:
      - name: Check out the sources
        uses: actions/checkout@v7

      # A self-hosted host is a machine somebody maintains, so the things that
      # are guaranteed on a GitHub-hosted image are not guaranteed here.  Each
      # of these has a way of failing *late* and looking like a design problem,
      # which is the reason they are checked up front: a Docker daemon the
      # runner user cannot reach makes the flow step fail on a socket permission
      # after the 180-minute budget has been spent waiting, and a full disk
      # makes place-and-route die in the middle of a run.
      - name: Check the host prerequisites
        run: |
          set -euo pipefail

          for tool in docker git make; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "The runner host has no '$tool' on PATH." >&2
              echo "This job runs on the host, not in a container, and needs it." >&2
              exit 1
            }
          done

          if ! docker info >/dev/null 2>&1; then
            echo "The Docker daemon is not reachable as $(id -un) (uid $(id -u))." >&2
            echo "Add this user to the 'docker' group, or make the socket" >&2
            echo "world-writable, and restart the runner service." >&2
            exit 1
          fi

          if [ -z "${HOME:-}" ] || [ ! -d "$HOME" ]; then
            echo "HOME is unset or missing; the PDK directory cannot be placed." >&2
            exit 1
          fi

          # Created here rather than in the flow step so that the filesystem it
          # lands on is the one just measured, and so that a runner account
          # without a writable home is reported before the image is pulled.
          mkdir -p "$HOME/.cache/librelane"

          # 20 GiB on each of the two filesystems, not on their sum.  A
          # judgement call rather than a measurement: the image is a few GB, the
          # PDK over one, and a run directory is several more once the detailed
          # routes and the GDS are in it.  They are two paths rather than one
          # because the PDK deliberately does *not* live in the workspace (see
          # the flow step), and on a runner whose home is on a different volume
          # - a separate data disk, which is the usual way to get the space at
          # all - checking only the workspace measures the wrong one.
          for dir in "$GITHUB_WORKSPACE" "$HOME/.cache/librelane"; do
            avail_kb=$(df -Pk "$dir" | awk 'NR == 2 { print $4 }')
            if [ "${avail_kb:-0}" -lt 20971520 ]; then
              echo "Only $((avail_kb / 1024)) MiB free on the filesystem holding" >&2
              echo "$dir; the flow needs about 20 GiB for the image, the PDK" >&2
              echo "and a run." >&2
              exit 1
            fi
            echo "  $((avail_kb / 1024)) MiB free on $dir"
          done
          echo "host ok: $(nproc) cpus, docker reachable as $(id -un)"

      - name: Log the approval
        run: |
          echo "This job ran in the '${{ github.job }}' context."
          echo "It is bound to the '${{ github.ref_name }}' branch at $(git rev-parse HEAD)."
          echo ""
          echo "Reminder: the approval is only enforced if a GitHub Environment"
          echo "named 'production' exists with 'Required reviewers' enabled."

      # The flow is run inside the pinned LibreLane container rather than on the
      # runner, because the toolchain is a large Nix closure and reproducing it on
      # the host is exactly the kind of thing that works locally and fails in CI.
      # `docker run` is used instead of a `container:` job on purpose: this job
      # is already the one that cannot nest containers (see above), and mounting
      # the workspace keeps the tool's own entry point in play.
      #
      # `HOME` is where the flow keeps its PDK download - over a gigabyte, and a
      # few minutes of wall clock - and it is bind-mounted from the *host* rather
      # than from a directory inside the workspace.  That is the one place this
      # job differs from a GitHub-hosted flow, and it is deliberate:
      # `actions/checkout` runs `git clean -ffdx` at the start of every job,
      # which deletes ignored files, so a PDK under `.cache/librelane` in the
      # checkout is thrown away by the *next* run and re-fetched whenever the
      # `actions/cache` entry is evicted.  A self-hosted runner keeps its disk
      # between runs, so `$HOME/.cache/librelane` is its own cache, it cannot be
      # deleted by a checkout, and no cache eviction can reach it.  Delete that
      # directory by hand to force a re-fetch.
      #
      # `--user` keeps the outputs owned by the runner rather than by root, so
      # that the next job's checkout can clean them and a local run can overwrite
      # them.
      - name: Run the LibreLane flow
        run: |
          set -o pipefail
          mkdir -p "$HOME/.cache/librelane" librelane/runs
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/pdks \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cache/librelane:/pdks" \
            -w /work \
            "$LIBRELANE_IMAGE" \
            librelane --pdk "$LIBRELANE_PDK" -s "$LIBRELANE_SCL" librelane/config.json \
            2>&1 | tee librelane/flow.log

      # LibreLane runs the GDSII stream-out twice - once per tool - and only the
      # *primary* one (PRIMARY_GDSII_STREAMOUT_TOOL) is written as the plain
      # `<design>.gds`; the other is `<design>.<tool>.gds`.  Glob for the plain
      # name and fall back to any GDS, because which tool is primary is a flow
      # variable and not something this workflow should hard-code.
      #
      # This replaces a `-path '*final*'` glob, which matched nothing: no step of
      # this flow creates a directory called `final`, so the step reported "No
      # GDSII was produced" after a run that had in fact produced one.
      - name: Locate the GDSII
        id: gds
        run: |
          set -o pipefail
          gds=$(find librelane/runs -mindepth 3 -maxdepth 3 -type f \
                  -name 'sw_switch.gds' | sort | head -1)
          if [ -z "$gds" ]; then
            gds=$(find librelane/runs -type f -name '*.gds' \
                    ! -name '*.magic.gds' ! -name '*.klayout.gds' | sort | head -1)
          fi
          if [ -z "$gds" ]; then
            echo "No GDSII was produced." >&2
            echo "GDS files the flow did produce:" >&2
            find librelane/runs -type f -name '*.gds' >&2 || true
            exit 1
          fi
          echo "GDSII: $gds"
          echo "gds_path=$gds" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp "$gds" out/sw_switch.gds
          ls -l out/

      # The step directories are numbered (`34-openroad-cts`) and the numbering
      # changes with the flow version, so the reports are found by name rather
      # than by a path pattern.  This used to glob `runs/*/reports/*/*.rpt`,
      # which is two levels too shallow: the reports live at
      # `runs/RUN_.../<NN>-<step>/...`, and the glob silently produced an empty
      # summary.
      - name: Summarise the result
        if: always()
        run: |
          {
            echo "### LibreLane"
            echo
            echo "Image: \`${LIBRELANE_IMAGE}\`  PDK: \`${LIBRELANE_PDK}/${LIBRELANE_SCL}\`"
            echo
            if [ -f librelane/flow.log ]; then
              echo '```text'
              tail -n 40 librelane/flow.log
              echo '```'
            fi

            echo
            echo "### Signoff"
            echo
            # The post-CTS timing report is the number worth quoting: the
            # pre-place figure is dominated by the unbuffered reset net and says
            # nothing about the design.  See librelane/README.md.
            #
            # One worst-slack report and one unconstrained-endpoint report are
            # picked out per run, by name.  Taking the first few files
            # alphabetically instead would select `checks.rpt` and `clock.rpt`
            # and bury `max.rpt`, which is the one anyone reads.
            for r in $(find librelane/runs -type f -path '*stapostpnr*' \
                         \( -name 'max.rpt' -o -name 'checks.rpt' \) | sort | head -3); do
              echo "#### \`$(basename "$r")\` — corner \`$(basename "$(dirname "$r")")\`"
              echo
              echo '```text'
              head -n 25 "$r"
              echo '```'
              echo
            done

            echo "### Synthesis"
            echo
            for r in $(find librelane/runs -type f -path '*synthesis*' -name 'stat.rpt' | sort | head -1); do
              echo '```text'
              head -n 30 "$r"
              echo '```'
            done

            echo
            echo "### DRC / LVS / XOR"
            echo
            for pat in drc lvs xor; do
              echo "#### $pat"
              echo
              for f in $(find librelane/runs -type f -iname "*${pat}*" \
                           \( -name '*.rpt' -o -name '*.log' \) | sort | head -3); do
                echo "\`$f\`"
                echo '```text'
                grep -iE 'violation|error|warning|mismatch|total|pass|fail' "$f" | head -n 8 || true
                echo '```'
                echo
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the GDSII
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: gdsii
          path: out/sw_switch.gds
          if-no-files-found: error
          retention-days: 90

      - name: Upload the full run directory
        # Everything, not just the GDSII: the per-step logs and the timing and
        # DRC reports are what make a flow failure diagnosable.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: librelane-run
          path: librelane/runs
          if-no-files-found: warn
          retention-days: 14
